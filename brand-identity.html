<style>
.brand-page{width:min(1440px,100%);margin:auto;padding:clamp(46px,7vw,100px) clamp(22px,7vw,100px) 90px}
.brand-intro{max-width:900px;margin-bottom:clamp(38px,6vw,76px)}
.brand-intro h1{font:700 clamp(3.3rem,8vw,7.5rem)/.94 "Space Grotesk",sans-serif;letter-spacing:-.075em;margin:18px 0 22px}
.brand-intro h1 em{font-style:normal;color:#ff4b55}
.brand-intro p{max-width:620px;color:#c5b6b3;line-height:1.8}
.brand-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.brand-project{min-width:0;background:#151113;border:1px solid rgba(255,255,255,.13);padding:clamp(10px,1.5vw,18px);transition:border-color .25s,transform .25s}
.brand-project:hover{border-color:#ff4b55;transform:translateY(-3px)}
.brand-project img{display:block;width:100%;height:auto;max-height:75vh;object-fit:contain;background:#0d090d}
.brand-project figcaption{padding:16px 4px 4px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.brand-project figcaption strong{font:600 1rem "Manrope",sans-serif;color:#f5eeee}
.brand-project figcaption span{font: .55rem "DM Mono",monospace;letter-spacing:.1em;color:#c5b6b3;text-transform:uppercase;text-align:right}
@media(max-width:700px){.brand-page{padding:45px 5vw 65px}.brand-grid{grid-template-columns:1fr;gap:18px}.brand-project img{max-height:none}.brand-project figcaption{flex-direction:column;gap:6px}.brand-project figcaption span{text-align:left}}
</style>
</head>
